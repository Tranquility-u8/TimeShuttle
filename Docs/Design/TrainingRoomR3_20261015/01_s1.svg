<text x="695" y="151" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#007D95">① 落石运动时，提示按 Q</text>
<text x="695" y="205" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">先看见威胁，再由玩家主动暂停。触发位置需配合落石预警、剩余路程</text>
<text x="695" y="253" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">和能量实测。</text>
<rect x="660" y="315" width="12" height="40" fill="#C43E50" stroke="#C43E50" stroke-width="2"/>
<text x="695" y="346" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#C43E50">② 危险范围扩大，终点保持中央</text>
<text x="695" y="400" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">全宽危险带向前加深，并延伸至中央两侧。红色表示危险覆盖，落石之</text>
<text x="695" y="448" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">间仍保留通行空间。</text>
<rect x="660" y="510" width="12" height="40" fill="#147C57" stroke="#147C57" stroke-width="2"/>
<text x="695" y="541" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#147C57">③ 在安全区认识能量消耗与恢复</text>
<text x="695" y="595" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">显示真实能量变化；主动结束能力，观察恢复。低能量与耗尽后果通过</text>
<text x="695" y="643" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">简短提示说明。</text>
<text x="695" y="784" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" fill="#576979">虚线仅示意建议触发带，具体位置需白盒验证。</text>
