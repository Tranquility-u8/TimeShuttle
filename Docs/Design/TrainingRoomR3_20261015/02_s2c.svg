<text x="695" y="151" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#007D95">① 看见边界 → 自行走入</text>
<text x="695" y="205" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">角色整体进入后合拢边界；未就位时不攻击。边界对玩家生效，敌方子</text>
<text x="695" y="253" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">弹可以穿过。</text>
<rect x="660" y="315" width="12" height="40" fill="#C43E50" stroke="#C43E50" stroke-width="2"/>
<text x="695" y="346" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#C43E50">② 固定敌位，先后展示两个方向</text>
<text x="695" y="400" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">两名正常敌人是本版建议，重新生成于远端左右。先采用错峰射击，避</text>
<text x="695" y="448" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">免第一次就同时夹击。</text>
<rect x="660" y="510" width="12" height="40" fill="#147C57" stroke="#147C57" stroke-width="2"/>
<text x="695" y="541" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#147C57">③ 近弹 QTE 始终可用，统一提示 Q</text>
<text x="695" y="595" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">真实躲过两侧有效攻击才通过。冻结或异常销毁的弹丸不能直接算作完</text>
<text x="695" y="643" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">成；通过后撤边界。</text>
<text x="695" y="785" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#18283A">删除 S2B；S2A 完成后直接进入 S2C。</text>
