<text x="695" y="141" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#007D95">7A：先撤台，再生成面前的近战敌人</text>
<text x="695" y="195" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">桌子、屏障与刷新补给在7A开始前移除。敌人根据玩家当前朝向选择合</text>
<text x="695" y="243" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">法前方位置，先预警再攻击。</text>
<rect x="660" y="325" width="12" height="40" fill="#A66800" stroke="#A66800" stroke-width="2"/>
<text x="695" y="356" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#A66800">7B：八件掩体 + 一处环境杀位置</text>
<text x="695" y="410" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">近、中、远层次交错，保留侧移通路。左后部增加吊石；一名远程敌人</text>
<text x="695" y="458" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">的活动范围经过落点。</text>
<rect x="660" y="540" width="12" height="40" fill="#147C57" stroke="#147C57" stroke-width="2"/>
<text x="695" y="571" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#147C57">实战只看战斗结果，允许不同解法</text>
<text x="695" y="625" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">全灭四敌即可；枪械、弱点、地形杀均可。环境杀不设置必用次数，7A</text>
<text x="695" y="673" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="400" fill="#576979">与7B分别重试。</text>
<text x="670" y="788" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#576979">L 低掩体   H 高掩体   M 近战   R 远程</text>
<text x="670" y="830" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#576979">红框为落点；虚线为旧桌位，进入7A前已撤除。</text>
